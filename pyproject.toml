[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "doo-doo-dynamics-simulator"
version = "0.1.0"
description = "Doo Doo Dynamics Simulator: clean-room CAD to structural simulation"
requires-python = ">=3.12"
license = "GPL-2.0-or-later"
dependencies = ["gmsh==4.15.2", "numpy==2.3.4"]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
open-sim = "opensim.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: requires Gmsh and a CalculiX executable"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opensim = ["viewer.html"]
